server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API is reverse-proxied so the browser only ever talks to one origin (no CORS needed).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets can be cached forever.
  location ~* \.(?:js|css|svg|woff2?|png|jpg|webp|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths fall back to index.html (never cache it).
  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
