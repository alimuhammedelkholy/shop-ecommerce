# Full stack: SQL Server + API + Angular (nginx).
#   docker compose up --build        ->  http://localhost:8080
# Only the database (for `dotnet run` / `ng serve` development):
#   docker compose up -d sqlserver
name: shop

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shop-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: ./backend
    container_name: shop-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ShopDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (32+ characters)}
      Database__Migrate: "true"
      Database__Seed: "true"
      Seed__SuperAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@shop.local}
      Seed__SuperAdmin__Password: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      Seed__DemoCustomer__Email: ${SEED_DEMO_EMAIL:-demo@shop.local}
      Seed__DemoCustomer__Password: ${SEED_DEMO_PASSWORD:-Demo@12345}
    ports:
      - "${API_PORT:-5080}:8080"
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: shop-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  sqldata:
